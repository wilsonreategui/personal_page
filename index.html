<!doctype html>
<html lang="es" data-active-page="informacion">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Portafolio personal de Wilson Reátegui: software, música, relatos y archivos creativos." />
    <title>Wilson Reátegui</title>
    <link rel="preload" href="fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="terminal" aria-label="Consola personal">
        <svg class="menu-connector" aria-hidden="true" focusable="false"></svg>
        <section class="type-section" data-typewriter-section="name" id="informacion">
            <p class="line section-line">
                <span class="prompt">#</span><span class="">Inicio</span><span class="line-fill" aria-hidden="true"
                    data-typewriter-show></span>
                <!-- <span class="section-icon" aria-hidden="true"
                    data-typewriter-show></span> -->
            </p>
            <div class="name-row">
                <h1>Wilson Reátegui</h1>
                <nav class="name-menu" aria-label="Menu principal">
                    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu-items"
                        aria-label="Abrir menú">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="name-menu__items" id="main-menu-items"></div>
                    <button class="name-menu__item lamp-toggle" type="button" aria-label="Cambiar tema"
                        aria-pressed="false">
                        <span class="lamp-icon" aria-hidden="true">
                            <span class="lamp-glyph"></span>
                        </span>
                    </button>
                </nav>
            </div>
        </section>
        <p class="sr-only" data-route-status aria-live="polite"></p>
        <div id="page-content" data-page-container aria-busy="false"></div>
        <noscript>
            <p class="page-status">Esta página necesita JavaScript para cargar sus secciones.</p>
        </noscript>
    </main>
    <script type="module" src="scripts/app.js"></script>
</body>

</html>
