<!doctype html>
<html lang="es" data-active-page="inicio" data-layout="flow">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Portafolio personal de Wilson Reátegui: software, música, relatos y archivos creativos." />
    <title>Wilson Reátegui | DEV</title>
    <link rel="preload" href="fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Ilustración compartida por las tarjetas de entrada de inicio y de
         Entradas. Los rellenos van como atributo con var() porque las reglas
         de clase del documento no alcanzan el árbol que crea <use>, pero las
         propiedades personalizadas sí se heredan y siguen al tema. -->
    <svg aria-hidden="true" hidden>
        <symbol id="pixel-news" viewBox="0 0 32 24">
            <rect width="32" height="24" fill="var(--color-bg-mid)" />
            <rect x="3" y="3" width="2" height="2" fill="var(--color-border-accent)" />
            <rect x="27" y="5" width="2" height="2" fill="var(--color-border-accent)" />
            <rect x="3" y="18" width="2" height="2" fill="var(--color-border-accent)" />
            <rect x="7" y="4" width="20" height="18" fill="var(--color-border-strong)" />
            <rect x="5" y="2" width="20" height="18" fill="var(--color-text-soft)" />
            <rect x="7" y="4" width="16" height="2" fill="var(--color-bg)" />
            <rect x="7" y="8" width="7" height="6" fill="var(--color-text-dim)" />
            <rect x="9" y="10" width="3" height="2" fill="var(--color-text-soft)" />
            <rect x="16" y="8" width="7" height="1" fill="var(--color-bg)" />
            <rect x="16" y="11" width="7" height="1" fill="var(--color-bg)" />
            <rect x="16" y="14" width="5" height="1" fill="var(--color-bg)" />
            <rect x="7" y="16" width="16" height="1" fill="var(--color-bg)" />
            <rect x="7" y="18" width="11" height="1" fill="var(--color-bg)" />
        </symbol>
    </svg>
    <main class="terminal" aria-label="Consola personal">
        <header class="system-brand" aria-label="Identidad del sitio">
            <a class="system-brand__mark" href="#inicio" aria-label="Ir al inicio">
                <span class="system-brand__monogram" aria-hidden="true">WR</span>
            </a>
            <div class="system-brand__data">
                <p class="system-brand__title">WILSON REÁTEGUI</p>
                <p class="system-brand__status">ESTADO: <span>EN LÍNEA</span></p>
            </div>
            <div class="system-brand__controls">
                <time class="system-brand__date" data-current-date aria-label="Fecha actual"></time>
                <a class="system-brand__dev" href="https://dev.wilsonreategui.com" target="_blank"
                    rel="noopener noreferrer" aria-label="Ir a dev.wilsonreategui.com">
                    <span>DEV</span>
                    <svg class="system-brand__dev-icon" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
                        <rect x="1" y="2" width="12" height="10" rx="1"></rect>
                        <path d="M1 5h12M3 3.5h1M5 3.5h1"></path>
                    </svg>
                </a>
                <button class="system-brand__theme lamp-toggle" type="button" aria-label="Cambiar tema"
                    aria-pressed="false">
                    <span class="lamp-icon" aria-hidden="true">
                        <span class="lamp-glyph"></span>
                    </span>
                </button>
            </div>
        </header>
        <div class="terminal-body">
            <svg class="menu-connector" aria-hidden="true" focusable="false"></svg>
            <section class="type-section" data-typewriter-section="name" id="cabecera">
                <div class="name-row">
                    <nav class="name-menu" aria-label="Menu principal">
                        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu-items"
                            aria-label="Abrir menú">
                            <span></span><span></span><span></span>
                        </button>
                        <div class="name-menu__items" id="main-menu-items"></div>
                    </nav>
                </div>
            </section>
            <p class="sr-only" data-route-status aria-live="polite"></p>
            <div id="page-content" data-page-container aria-busy="false"></div>
            <noscript>
                <p class="page-status">Esta página necesita JavaScript para cargar sus secciones.</p>
            </noscript>
        </div>
    </main>
    <script type="module" src="scripts/app.js?v=20260807-2"></script>
</body>

</html>
